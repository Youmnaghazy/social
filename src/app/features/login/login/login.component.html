
<form [formGroup]="loginForm" (ngSubmit)="login()" class="bg-gray-300 rounded-lg shadow p-3 mx-auto w-1/2">
  <h1 class="text-center text-blue-700">Login Form</h1>



    <div class="mb-6">
        <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Email address</label>
        <input formControlName="email" type="email" id="email" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="john.doe@company.com" required />
    </div>
    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched)  {
      <div class="flex p-4 mb-4 text-sm text-fg-danger-strong rounded-base bg-danger-soft border border-danger-subtle" role="alert">
  <svg class="w-4 h-4 me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
  <span class="sr-only">danger</span>
  <div>
    <span class="font-medium">Ensure that these requirements are met:</span>
      <ul class="mt-2 list-disc list-outside space-y-1 ps-2.5">
        @if (loginForm.get('email')?.hasError('required')) {
                  <li>Full email is required</li>
        }

    @else {        <li>type a valid email </li>
}

    </ul>
  </div>
</div>
}



    <div class="mb-6 relative">
        <label for="password" class="absolute block mb-2.5 text-sm font-medium text-heading">Password</label>
        <input #pass formControlName="password" type="password" id="password" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="•••••••••" required />
    <div class="absolute top-1/2 right-4 -translate-y-1/2">
      <i (click)="togglePass(pass)" class="fa-regular fa-eye cursor-pointer"></i>
    </div>
      </div>

    <button  type="submit" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Submit
@if (loading()) {
        <i class="fa-solid fa-spinner fa-spin"></i>

}
    </button>
  <p class="text-center text-red-600">{{msgError}}</p>

  </form>
